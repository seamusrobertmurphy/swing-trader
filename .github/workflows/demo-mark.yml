# Settle the demo's paper tickets once their horizon has passed, every hour.
name: demo-mark

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 05-research/demo/requirements.txt
      - run: pip install -r 05-research/demo/requirements.txt
      - id: publish
        name: Settle and publish
        run: |
          out=$(bash 05-research/demo/publish.sh "" "Settle demo tickets")
          echo "$out"
          if echo "$out" | grep -q "^published"; then echo "changed=yes" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: mark
    if: needs.mark.outputs.changed == 'yes' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/demo-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
