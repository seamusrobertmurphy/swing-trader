# Backup scheduler for the stock book (added 2026-10-14). The laptop's launchd
# tick misses whole days when the Mac sleeps or a step hangs, which cost the
# week of 28 September and Monday 21 September. This runs the same tick on a
# GitHub runner. Both read the last rebalance from the broker's own order
# history, so whichever wakes first in the week trades and the other stands
# down.
#
# GitHub delivers far fewer scheduled runs than the cron asks for: the hourly
# demo-mark ran 32 times in the 7.8 days to 14 October. This is therefore a
# backup to the laptop, not a replacement for it.
#
# The alarm. The tick exits 1 when a rebalance is more than 8 days old on a
# trading day, or when any step fails or times out, and GitHub emails the
# repository owner about a failed scheduled run.
name: trader-tick

on:
  schedule:
    - cron: "7,27,47 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Say what is due and change nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: trader-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      # The paper address, set here so the runner never inherits another one.
      # LIVE_TRADING is deliberately absent, and alpaca_trade.py refuses any
      # other address without it.
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 05-research/scripts/trader-requirements.txt
      - run: pip install -r 05-research/scripts/trader-requirements.txt
      - name: Tick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python 03-inputs/schedule_tick.py --host actions --dry-run
          else
            python 03-inputs/schedule_tick.py --host actions
          fi
      - name: Collect what the tick wrote
        if: always()
        run: |
          mkdir -p _out
          git ls-files -m -o --exclude-standard -z -- 05-research 04-outputs \
            | xargs -0 -r cp --parents -t _out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tick-${{ github.run_id }}
          path: _out
          if-no-files-found: ignore
          retention-days: 90
